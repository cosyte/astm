name: Nightly fuzz

# Continuous fuzzing of the two byte-level surfaces: the E1381 frame codec and the CLSI-LIS02
# record tokenizer. Every night, and on demand, this calls the shared nightly-fuzz.yml at the
# published reference the other callers here name, and that workflow runs `pnpm fuzz`: the three
# fuzz suites under test/property/ (arbitrary and near-miss bytes through the frame decoder, lenient
# and strict; structural noise through the record parser, lenient and strict; and two messages in
# one stream under random delimiter sets). Here each target generates hostile inputs for a time
# budget instead of its committed run count, from a seed that changes with every run, so each night
# explores a different slice of the input space.
#
# The pull-request smoke run is `pnpm test`: the shared CI job runs the same targets on every pull
# request at their base counts. This run is the deep search that would make a pull request slow.
#
# A crash, hang, or runaway allocation fails the run. The log prints the counterexample, the seed,
# and the path. The seed is this run's id: `ASTM_FUZZ_SEED=<run id> pnpm fuzz` replays it, and
# test/property/_fuzz-config.ts says how to step straight to the shrunk case.
#
# A job that calls a reusable workflow cannot set its own timeout. The shared job stops at 60
# minutes; the command bounds itself tighter, and `timeout` fails a run that hangs, which is the
# one failure the per-case budget cannot see (a synchronous loop that never returns to it).
#
# Schedule and dispatch only: never a required check.

on:
  schedule:
    # 04:17 UTC daily. An odd minute: GitHub delays scheduled runs at the start of every hour.
    - cron: "17 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    uses: cosyte/.github/.github/workflows/nightly-fuzz.yml@c0db8d8e5927269820de4401b3b5ad6141854b76 # workflows-2026-11-08-c0db8d8e5927
    with:
      fuzz-cmd: ASTM_FUZZ_SEED="$GITHUB_RUN_ID" ASTM_FUZZ_SECONDS=120 timeout --kill-after=1m 40m pnpm fuzz
