name: Fuzz

# Nightly extended fuzz of the two byte-level surfaces: the E1381 frame codec and the CLSI-LIS02
# record tokenizer. The same property suites run in every CI at a lower case count; this job scales
# them up (ASTM_FUZZ_RUNS) so rare degeneracies get more chances to surface off the PR critical path.
# Self-contained by design: fuzzing is an extra, scheduled surface, not one of the shared CI gates.

on:
  schedule:
    - cron: "17 4 * * *" # nightly, 04:17 UTC
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTM_FUZZ_RUNS: "25000"
    steps:
      # Actions are pinned to a commit rather than to a tag that can move.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:fuzz
