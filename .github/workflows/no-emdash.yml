name: Em-dash gate

# The brand rule (founder directive 2026-07-24, knowledgebase 06-brand/voice-and-tone.md)
# bans U+2014 outright across every cosyte surface, and names commit messages explicitly.
#
# astm is the repo this gate reached LAST, and the only one where it did not arrive on a
# clean tree: the change that landed this workflow also swept 1,129 occurrences out of 108
# of the 142 tracked files, including `package.json`'s published npm `description` and the
# `docs-content/` pages that publish to docs.cosyte.com. A sweep without the gate grows
# back; a gate without the sweep would have red-flagged CI on arrival. Both are one commit.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml:
#
#   The reusable pipeline is not an option. astm's `ci` job calls
#   cosyte/.github/.github/workflows/ci.yml@main, which runs a fixed ladder and no
#   arbitrary repo script.
#
#   Within astm, the deciding factor is the trigger. The PR-text half below needs the
#   `edited` activity type, which is not a default: without it, a title or body edited
#   after the last push is never re-checked, and since this repo squash-merges, the PR
#   title and body ARE the commit message that lands on main. But ci.yml's triggers drive
#   the full Node 22 + 24 matrix (typecheck, lint, format, PHI scan, test, coverage,
#   build, attw, dual ESM/CJS smoke). Re-running all of that every time someone fixes a
#   typo in a PR description is a large cost for no extra safety. Same call hl7 and
#   website made, for the same reason.
#
# Run it locally with `pnpm check:no-emdash`, which is also on `scripts/verify.sh astm`'s
# ladder in the meta-repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` is deliberate and load-bearing. See the note above.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-emdash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history: the commit-message step below reads the PR's commit range,
          # and the default shallow clone does not contain the base commit.
          fetch-depth: 0

      - name: Check tracked files
        run: bash scripts/check-no-emdash.sh

      # The rule names commit messages explicitly, and a squash merge composes its
      # message from the PR title, the PR body, and the branch commits, so all three are
      # checked. Pull requests only: on a push to main the message is already written,
      # and this gate exists to stop it landing.
      - name: Check PR title, body, and commit messages
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Collect first, scan second, and set the shell options here rather than trust
          # the runner's default: piping the collection straight into the scanner would
          # hide a failed `git log` (a rewritten base commit, or a future edit that drops
          # fetch-depth) behind a clean title and body, and the gate would print OK over
          # commits it never read. The title and body arrive through env and are never
          # interpolated into the script, so a PR description cannot inject shell.
          set -euo pipefail
          {
            printf '%s\n' "$PR_TITLE"
            printf '%s\n' "$PR_BODY"
            git log --format=%B "$BASE_SHA..$HEAD_SHA"
          } > "$RUNNER_TEMP/pr-messages.txt"
          bash scripts/check-no-emdash.sh --stdin "the PR title, body, or commit messages" \
            < "$RUNNER_TEMP/pr-messages.txt"
