name: Release

# Thin caller of the shared release pipeline: Changesets -> npm publish through trusted publishing
# (OIDC, with provenance) -> docs artifacts -> GitHub release -> repository_dispatch to cosyte/docs.
# No npm token exists: the package's trusted publisher on npmjs.com names this repository and this
# file, and npm exchanges the job's `id-token: write` grant for a short-lived publish token.
# `secrets: inherit` passes DOCS_REPO_DISPATCH_TOKEN, and RELEASE_PR_TOKEN when one is set.
#
# THE DEPENDENCY INVENTORY TRAVELS INSIDE source.tar.gz, AND NOTHING IS UPLOADED AFTER THE RELEASE.
# The shared pipeline creates the GitHub release with its two assets (docs-content.tar.gz,
# source.tar.gz) in one call, as a draft that is published only once they are uploaded, and a
# published release is immutable: an asset added afterwards is refused, so a version would lose it
# for good. `pnpm pack:docs` (scripts/build-docs-artifacts.sh), which the pipeline runs just before
# that call, produces and grades dependency-inventory.cdx.json and puts it in source.tar.gz. This
# workflow used to upload it as a third asset from a job after the publish; that job is gone.

on:
  push:
    branches: [main]

# Read-only by default: the release job below grants itself the writes the shared pipeline needs.
permissions:
  contents: read

jobs:
  release:
    # Required. The repo default for GITHUB_TOKEN is `contents: read`, and a called workflow can only
    # downgrade the caller's token, never escalate it, so without this the shared pipeline's
    # `contents/id-token/pull-requests: write` is an escalation and GitHub rejects the whole workflow
    # at startup (1s, no jobs, no logs).
    permissions:
      actions: read # the shared workflow reads this caller's environment protection with it
      contents: write # create tags / the GitHub release
      id-token: write # npm provenance
      pull-requests: write # open the "Version Packages" PR
    uses: cosyte/.github/.github/workflows/release.yml@c0db8d8e5927269820de4401b3b5ad6141854b76 # workflows-2026-11-08-c0db8d8e5927
    with:
      package-name: "@cosyte/astm"
    secrets: inherit
