name: PR title

# Conventional Commits for every pull request title: this repository squash-merges, so the title is
# the commit that lands on main. The rule lives in the shared workflow, the same in every Cosyte
# repository; this caller only triggers it. Its one context is `pr-title / conventional-commits`.

on:
  pull_request:
    branches: [main]
    # `edited` is load-bearing: a title changed after the last push is the title that lands.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    permissions:
      contents: read
    uses: cosyte/.github/.github/workflows/pr-title.yml@498c7c13c8869bf11b67fa8324684ec2dc691ec6 # workflows-2026-11-07-498c7c13c886
