name: Public-surface gate

# Founder directive 2026-07-27: no internal project bookkeeping on any surface a consumer
# reads. Item identifiers (`ASTM-7`, `REAL-CORPUS`), phase and wave language, ADR numbers,
# meta-repo paths, prose citations of the roadmap and process commentary belong in the
# changeset, CHANGELOG.md, the commit, the PR and the roadmap, never in README.md,
# docs-content/, the npm description, a JSDoc block a consumer's editor renders, or a
# message string a consumer reads in their logs. The rule is written out in the meta-repo's
# `documentation/conventions.md` ("No internal project bookkeeping on a public surface");
# `scripts/check-no-internal-refs.sh` is what enforces it.
#
# WHY A GATE AND NOT A NOTE. The founder, on the sweep that removed 149 of these across the
# ecosystem: "it needs to not just be a memory note, but something that is addressed in the
# workflow accordingly. This needs to not happen again." A sweep regresses the first time
# someone writes `(ASTM-10)` into a doc comment; a job that reds does not. THIS REPO HAD NO
# SUCH GATE AT ALL until this workflow landed, which is why the class had regrown into the
# doc comments of fifteen source files and into the published `dist/index.d.ts`.
#
# WHAT ACTUALLY SCANS, AND WHERE THE RULE LIVES. `pnpm check:no-internal-refs`, which is
# this repository's own checker. The job below delegates the plumbing (checkout, pnpm,
# Node) to the shared gate workflow, which carries no pattern, no allow-list and no file
# selection of its own: it prepares the tree, runs the command, and lets the command's
# exit status decide the job. The detection rules, the self-tests and the known project
# prefixes all stay here, because what counts as a project prefix and what counts as a
# domain designator is a property of this package.
#
# THE JOB ID IS LOAD-BEARING. A called job's check run is named
# `<caller job id> / <inner job id>`, so the job id `no-internal-refs` below publishes
# `no-internal-refs / public-surface`, which is the context a branch ruleset must require.
# Renaming the job detaches that requirement with no error anywhere, and a required
# context nothing emits blocks every pull request.
#
# WHY A SEPARATE WORKFLOW, and not a job in ci.yml. The shared ci pipeline is not an option:
# this repo's `ci` job calls cosyte/.github/.github/workflows/ci.yml@main, which runs a
# fixed ladder and no arbitrary repo script. Adding this there would also flip every other
# caller red on its next run, and remediating each repo is its own deliberate piece of work.
# A shared pipeline is the wrong place to land a rule most of its callers cannot yet
# satisfy. Keeping it out of ci.yml also keeps it cheap: this job is a checkout and a
# handful of greps over 11 markdown/JSON files and 47 source files, while ci.yml drives the
# full Node 22 + 24 matrix.
#
# WHAT THIS DOES NOT CHECK, deliberately: the PR title, the PR body, and commit messages.
# THIS rule says identifiers BELONG in the commit, the PR and the changeset, so a PR-text
# half here would red on correct work. That is also why there is no `edited` trigger:
# nothing here reads PR text, so retitling a PR cannot change the result.
#
# The other half of this rule, the one that keeps identifiers out of a published RELEASE
# BODY, lives in the shared pipeline: `cosyte/.github` `scripts/release-notes.mjs assert`
# re-reads the finished body bytes and refuses to publish a violating one. This job covers
# the repo's own files; that one covers what gets published to the releases page.
#
# THE WORKFLOW `name:` ABOVE IS NOT THE CHECK-RUN CONTEXT. The context a branch ruleset must
# require is the JOB ID below, `no-internal-refs` -- not "Public-surface gate". Requiring the
# workflow name instead blocks every pull request permanently, because no check run ever
# reports under it. That trap has fired live in a sibling repo on this exact workflow.
#
# Run it locally with `pnpm check:no-internal-refs`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check-run context prefix. See the note above before touching this id.
  no-internal-refs:
    # Pinned to the 40 character commit, not to the tag beside it: a tag can be moved
    # or deleted by anyone who gains write access to the workflow's repository, so a
    # tag is not an immutable reference and is not a pin. The trailing comment is the
    # published reference that commit was released as, so the release note stays
    # findable from here.
    uses: cosyte/.github/.github/workflows/gate-no-internal-refs.yml@84ecccd771cbc9c1ece003a3f8ff61415360395b # workflows-2026-09-18-84ecccd771cb
    # No more than the scan needs. A called workflow's GITHUB_TOKEN can only be
    # downgraded by its caller, and this gate reads the tree and nothing else.
    permissions:
      contents: read
