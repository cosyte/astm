name: CI

on:
  push:
    branches: [main, test/testing-standard]
  pull_request:
    branches: [main]
  schedule:
    # The nightly run on main, 05:33 UTC. An odd minute: GitHub delays scheduled runs at the start of every hour.
    - cron: "33 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Universal gates from the shared pipeline (typecheck, lint, format, PHI scan, test, coverage,
  # build, attw, dual ESM/CJS smoke, actionlint) on Node 22, 24 and 26, the matrix the pipeline runs
  # by default, on Linux, Windows and macOS. Every caller of the shared workflows names one published
  # `workflows-*` reference, pinned by its commit. Repo-specific extra jobs (an examples smoke, for
  # instance) are added on top of this caller, never instead of it.
  #
  # The testing standard's jobs run beside `verify`, never after it, so a pull request waits for the
  # slowest job rather than their sum:
  # - `bun` and `deno`: the whole suite again under Bun and under Deno, each in its own job on
  #   Linux. A test that cannot run there is skipped by name with its reason, through the checks
  #   in test/_helpers/runtime.ts.
  # - `coverage-ratchet`: coverage held to quality-floor.json, and on a pull request every changed
  #   line that coverage counts must have run and no floor may be lowered or removed;
  # - `mutation` (pull requests only): the changed source files mutated with stryker.config.mjs,
  #   and every mutant in the changed lines killed. The full run is weekly-mutation.yml's.
  #
  # The performance standard's two jobs run beside `verify` too:
  # - `scaling-gate`: `pnpm test:perf`, the scaling gates on the record parse, the strict
  #   validation, the record build and the framed parse, and their self-checks, never under
  #   coverage.
  # - `bench-compare` (pull requests only): bench/astm.bench.mjs timed on the base build and the
  #   head build, interleaved on one runner, at each shape's first size. Advisory: it never fails,
  #   so never require it. The large sizes are measured by bench.yml's reading instead.
  #
  # A skipped job satisfies a required check, so require `bun`, `deno`, `coverage-ratchet`,
  # `mutation` or `scaling-gate` only while its input below stays on.
  #
  # This caller, nightly-properties.yml and weekly-mutation.yml name the newest release, whose weekly
  # run is sharded; the other callers move to it with the next change to them. A
  # release's name carries its date, which a PHI scan of a changed file reads as a date of service,
  # so the comment names its commit instead.
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@398cd4ded647dddd9f2e220ceb042840f59e1426 # the release of 398cd4ded647
    with:
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      run-phi-scan: true
      run-bun: true
      run-deno: true
      run-coverage-ratchet: true
      run-mutation: true
      run-scaling-gate: true
      run-bench-compare: true
      bench-suites: bench/astm.bench.mjs

  # The runnable examples under examples/, checked the way a consumer meets them: each imports
  # `@cosyte/astm` by name, which resolves through package.json `exports` to the BUILT dist/, so
  # the build runs first. Each example asserts its own output, so `pnpm examples` goes red when one
  # drifts from the package. The PHI scan's default walk (src/, test/, scripts/, docs-content/)
  # does not reach examples/, so the example files are named to it here.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit rather than to a tag that can move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck:examples
      - run: pnpm lint:examples
      - run: pnpm examples
      - run: pnpm phi-scan:examples

  # The repository's documents, each checked by the shared checker in @cosyte/script-utils: the
  # README against the house skeleton and npm's size limit, the CLAUDE.md card against its spec,
  # and the package.json description against the catalog of our libraries.
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit rather than to a tag that can move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:readme
      - run: pnpm check:claude-card
      - run: pnpm check:catalog
