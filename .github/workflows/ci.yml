name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The nightly run on main, 05:33 UTC. An odd minute: GitHub delays scheduled runs at the start of every hour.
    - cron: "33 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Universal gates from the shared pipeline (typecheck, lint, format, test, coverage, build, attw,
  # dual ESM/CJS smoke, actionlint) on Node 22, 24 and 26, the matrix the pipeline runs by default.
  # Every caller of the shared workflows names one published `workflows-*` reference, pinned by its
  # commit, and the references move together. Repo-specific extra jobs (an examples smoke, for
  # instance) are added on top of this caller, never instead of it.
  # The template ships a PHI scanner (scripts/phi-scan.ts), so the shared pipeline's optional
  # PHI-scan step is switched on. NOTE: the scaffolded scanner is a STARTER. It detects only
  # cross-cutting SSN/email shapes until you add structured, field-level detection for this
  # standard's PHI (see the STARTER banner in scripts/phi-scan.ts).
  #
  # The performance standard's two jobs run beside `verify`, never after it, so a pull request waits
  # for the slowest job rather than their sum:
  # - `scaling-gate`: `pnpm test:perf`, the scaling gates on the record parse, the strict
  #   validation, the record build and the framed parse, and their self-checks, never under
  #   coverage. A skipped job satisfies a required check, so require `ci / scaling-gate` only while
  #   its input below stays on.
  # - `bench-compare` (pull requests only): bench/astm.bench.mjs timed on the base build and the
  #   head build, interleaved on one runner, at each shape's first size. Advisory: it never fails,
  #   so never require it. The large sizes are measured by bench.yml's reading instead.
  #
  # This caller alone is one release ahead of the others: the release of commit 0be6757a7738 is the
  # first with those two jobs. Its name carries its date, which a PHI scan of a changed file reads
  # as a date of service, so the comment names its commit instead. The other callers move to it
  # with the next change to them.
  ci:
    uses: cosyte/.github/.github/workflows/ci.yml@0be6757a773885cbd5165dbfa0f93772d907b3e8 # the release of 0be6757a7738
    with:
      run-phi-scan: true
      run-scaling-gate: true
      run-bench-compare: true
      bench-suites: bench/astm.bench.mjs

  # The runnable examples under examples/, checked the way a consumer meets them: each imports
  # `@cosyte/astm` by name, which resolves through package.json `exports` to the BUILT dist/, so
  # the build runs first. Each example asserts its own output, so `pnpm examples` goes red when one
  # drifts from the package. The PHI scan's default walk (src/, test/, scripts/, docs-content/)
  # does not reach examples/, so the example files are named to it here.
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit rather than to a tag that can move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck:examples
      - run: pnpm lint:examples
      - run: pnpm examples
      - run: pnpm phi-scan:examples

  # The repository's documents, each checked by the shared checker in @cosyte/script-utils: the
  # README against the house skeleton and npm's size limit, the CLAUDE.md card against its spec,
  # and the package.json description against the catalog of our libraries.
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit rather than to a tag that can move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:readme
      - run: pnpm check:claude-card
      - run: pnpm check:catalog
