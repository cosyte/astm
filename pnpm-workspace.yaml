# Install-time supply-chain controls for this package.
#
# minimumReleaseAge holds every resolution back by 24 hours (1440 minutes).
# Malware published to a registry is usually pulled within that window, so a
# delayed resolution most likely never sees the bad version at all. If a range
# has no version old enough, pnpm refuses the install; that refusal IS the
# control working and is never to be answered by lowering the number.
#
# trustPolicy no-downgrade refuses a resolution that would move a package
# backwards, which is how a downgrade attack reintroduces a fixed advisory.
#
# Both settings are read by pnpm 10.16.0 and 10.21.0 upwards respectively, so
# the packageManager pin in package.json is part of this control rather than a
# separate housekeeping choice: an older pnpm ignores the keys entirely and
# leaves a settings file that decorates rather than defends.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
